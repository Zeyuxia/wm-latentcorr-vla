chunk: 16
n_previous: 4
n_view: 1
model:
  pretrained_checkpoint: /data/weights/my_enervee_model/EnerV_AC_deepspeed_v0.1.pt
  auto_padzero_input_block: false
  auto_padrand_input_block: false
  base_learning_rate: 5.0e-05
  scale_lr: false
  target: evac.lvdm.models.ddpm3d.ACWMLatentDiffusion
  params:
    rescale_betas_zero_snr: true
    parameterization: v
    linear_start: 0.00085
    linear_end: 0.012
    num_timesteps_cond: 1
    log_every_t: 20
    timesteps: 1000
    first_stage_key:
    - video
    - traj
    cond_stage_key: delta_action
    cond_stage_trainable: false
    image_proj_model_trainable: true
    traj_prompt_proj_model_trainable: true
    conditioning_key: hybrid
    image_size:
    - 32
    - 40
    channels: 4
    scale_by_std: false
    scale_factor: 0.18215
    use_ema: false
    uncond_prob: 0.1
    uncond_type: zero_embed
    rand_cond_frame: true
    use_dynamic_rescale: true
    base_scale: 0.7
    fps_condition_type: fps
    perframe_ae: true
    ae_batch_size: 2
    chunk: ${chunk}
    n_view: ${n_view}
    use_raymap_dir: true
    use_raymap_origin: true
    use_cat_mask: true
    sparse_memory: true
    ddim_num_chunk: 1
    views_name_wo_imgcat:
    - left_hand
    - right_hand
    unet_config:
      target: evac.lvdm.modules.networks.openaimodel3dcausal.UNetModel
      params:
        in_channels: 19
        out_channels: 4
        model_channels: 320
        attention_resolutions:
        - 4
        - 2
        - 1
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 4
        - 4
        dropout: 0.1
        num_head_channels: 64
        transformer_depth: 1
        context_dim: 1024
        use_linear: true
        use_checkpoint: true
        temporal_conv: true
        temporal_attention: true
        temporal_selfatt_only: true
        temporal_batch_size: -1
        use_causal_attention: false
        temporal_length: 20
        addition_attention: true
        image_cross_attention: true
        traj_cross_attention: true
        default_fs: 30
        fs_condition: true
        resblock_updown: false
        chunk: ${chunk}
        n_view: ${n_view}
        causal_temp_conv: true
        use_block_idx: true
        use_domain_embedding: true
        adapt_to_mvt: true
    first_stage_config:
      target: evac.lvdm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity
    cond_stage_config:
      target: evac.lvdm.modules.encoders.resampler.Resampler
      params:
        dim: 1024
        depth: 4
        dim_head: 64
        heads: 12
        num_queries: 16
        embedding_dim: 14
        output_dim: 1024
        ff_mult: 4
    img_cond_stage_config:
      target: evac.lvdm.modules.encoders.condition.FrozenOpenCLIPImageEmbedderV2
      params:
        abspath: /data/weights/clip_vit_h_14_laion2b_s32b_b79k/open_clip_pytorch_model.bin
        freeze: true
    image_proj_stage_config:
      target: evac.lvdm.modules.encoders.resampler.Resampler
      params:
        dim: 1024
        depth: 4
        dim_head: 64
        heads: 12
        num_queries: 16
        embedding_dim: 1280
        output_dim: 1024
        ff_mult: 4
        video_length: 16
data:
  target: dataset.utils_data.DataModuleFromConfig
  params:
    batch_size: 4
    num_workers: 8
    train:
      target: dataset.agibotworld_iros_challenge_dataset.AgiBotWorldIROSChallenge
      params:
        data_roots:
        - /data/yujieyang/datasets/robotwin_agibotworld_format_mixed5tasks_clean50_plus_pi05_rollout
        domains:
        - robotwin_new
        split: train
        sample_size:
        - 256
        - 320
        sample_n_frames: 36
        preprocess: resize
        valid_cam: head
        chunk: ${chunk}
        n_previous: ${n_previous}
        previous_pick_mode: random
        random_crop: true
        min_sep: 1
        max_sep: 2
        fps: 30
